<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Quiz</title>
    <link rel="stylesheet" href="custom.css"/>
</head>
<body>
    <div class="main">
        <div id="box"> 
            <h2 id="quesBox">1-  This is a question </h2>
            <div class="row">
                <input class="option" id="option1" type="radio" value="a" name="option"/>
                <label for=""> a-  option 1 </label>
            </div>
            <div class="row">
                <input class="option" id="option2" type="radio" value="b" name="option"/>
                <label for=""> b-  option 2 </label>
            </div>
            <div class="row">
                <input class="option" id="option3"  type="radio" value="c" name="option"/>
                <label for=""> c-  option 3 </label>
            </div>
            <div class="row">
                <input  class="option" id="option4" type="radio" value="d" name="option"/>
                <label for=""> d-  option 4 </label>
            </div>
            <button class="btn" onclick="submitQuiz()">
                submit
            </button>
            </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
